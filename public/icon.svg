<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2d1708" />
      <stop offset="55%" stop-color="#140b05" />
      <stop offset="100%" stop-color="#080402" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <filter id="divineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Sanctuary Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />
  <rect width="496" height="496" x="8" y="8" rx="92" fill="none" stroke="#78350f" stroke-width="2" opacity="0.6" />

  <!-- Sacred Rays of Light -->
  <g opacity="0.25" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="90" x2="256" y2="50" />
    <line x1="256" y1="310" x2="256" y2="350" />
    <line x1="146" y1="200" x2="106" y2="200" />
    <line x1="366" y1="200" x2="406" y2="200" />
    <line x1="178" y1="122" x2="150" y2="94" />
    <line x1="334" y1="278" x2="362" y2="306" />
    <line x1="334" y1="122" x2="362" y2="94" />
    <line x1="178" y1="278" x2="150" y2="306" />
  </g>

  <!-- Radiant Aura Ring -->
  <circle cx="256" cy="200" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6 4" opacity="0.4" />
  <circle cx="256" cy="200" r="76" fill="#451a03" fill-opacity="0.3" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- Sacred Host (Pan Vivo) -->
  <circle cx="256" cy="200" r="62" fill="url(#hostGrad)" filter="url(#divineGlow)" />

  <!-- Cross inside the Host (IHS Emblem / Latin Cross) -->
  <path d="M256 160 L256 240 M236 186 L276 186" stroke="#92400e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Chalice Base and Stem -->
  <!-- Upper Cup -->
  <path d="M196 230 C200 310, 312 310, 316 230 Z" fill="url(#goldGrad)" opacity="0.9" />
  <!-- Node / Knob -->
  <ellipse cx="256" cy="326" rx="20" ry="12" fill="url(#goldGrad)" />
  <!-- Stem -->
  <path d="M251 310 L251 390 L261 390 L261 310 Z" fill="url(#goldGrad)" />
  <!-- Base -->
  <path d="M210 420 C230 395, 282 395, 302 420 C290 430, 222 430, 210 420 Z" fill="url(#goldGrad)" />

  <!-- Text / Title bottom -->
  <text x="256" y="468" font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="700" fill="#fef3c7" text-anchor="middle" letter-spacing="4">PAN VIVO</text>
</svg>
